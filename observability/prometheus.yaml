# prometheus.yaml
global:
  scrape_interval: 5s
  evaluation_interval: 30s

scrape_configs:
  - job_name: vllm
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /run/secrets/mlx_gateway_token
    tls_config:
      ca_file: /run/secrets/ai_gateway_ca
    static_configs:
      - targets:
          - 'host.orb.internal:19444'

  - job_name: litellm
    metrics_path: /metrics/
    authorization:
      type: Bearer
      credentials_file: /run/secrets/litellm_metrics_key
    static_configs:
      - targets:
          - 'host.docker.internal:4000'
