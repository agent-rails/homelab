# docker-compose.yaml
services:
  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver # accept OTLP metrics from Claude Code at /api/v1/otlp/v1/metrics
    extra_hosts:
      - "host.docker.internal:host-gateway"     # allow a direct connection from container to the local machine
    ports:
      - "127.0.0.1:9090:9090"   # local only: the OTLP receiver accepts writes without authentication
    volumes:
      - ${PWD}/prometheus.yaml:/etc/prometheus/prometheus.yml # mount Prometheus config file
      - prometheus-data:/prometheus
    secrets:
      - litellm_metrics_key
      - mlx_gateway_token
      - ai_gateway_ca

  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000" # local only
    volumes:
      - ${PWD}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${PWD}/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:

secrets:
  litellm_metrics_key:
    environment: LITELLM_METRICS_KEY
  mlx_gateway_token:
    file: ${HOME}/.config/ai-gateway/mlx.token
  ai_gateway_ca:
    file: ${HOME}/.config/ai-gateway/data/caddy/pki/authorities/local/root.crt
