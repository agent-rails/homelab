# docker-compose.yaml
services:
  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.size=10GB
      - --web.enable-otlp-receiver # accept OTLP metrics from Claude Code at /api/v1/otlp/v1/metrics
    extra_hosts:
      - "host.docker.internal:host-gateway"     # allow a direct connection from container to the local machine
    ports:
      - "127.0.0.1:9090:9090"   # local only: the OTLP receiver accepts writes without authentication
    volumes:
      - ${PWD}/prometheus.yaml:/etc/prometheus/prometheus.yml # mount Prometheus config file
      - prometheus-data:/prometheus
    secrets:
      - litellm_metrics_key
      - mlx_gateway_token
      - ai_gateway_ca

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command:
      - --config=/etc/otelcol/config.yaml
      - --config=${OTELCOL_DEBUG_CONFIG:-/etc/otelcol/empty.yaml}
    ports:
      - "127.0.0.1:4318:4318"   # local only: OTLP http ingest is unauthenticated
    volumes:
      - ${PWD}/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      - ${PWD}/otel-collector/empty.yaml:/etc/otelcol/empty.yaml:ro
      - ${PWD}/otel-collector/config.debug.yaml:/etc/otelcol/config.debug.yaml:ro
    mem_limit: 512m
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.10@sha256:12b0820f13ffa10ce956b6e9acc3b03f3cffded99109be6cc09d106fe56e5d38
    profiles: [traces]
    command:
      - -config.file=/etc/tempo/config.yaml
    volumes:
      - ${PWD}/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.6.20@sha256:be040ec94865dabe4821ce1c0f109452bd4b5acb566ae376672696eb43caedb7
    profiles: [logs]
    command:
      - -config.file=/etc/loki/config.yaml
    volumes:
      - ${PWD}/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000" # local only
    volumes:
      - ${PWD}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${PWD}/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets:
      - slack_webhook_url

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:

secrets:
  litellm_metrics_key:
    environment: LITELLM_METRICS_KEY
  mlx_gateway_token:
    file: ${HOME}/.config/ai-gateway/mlx.token
  ai_gateway_ca:
    file: ${HOME}/.config/ai-gateway/data/caddy/pki/authorities/local/root.crt
  slack_webhook_url:
    file: ${HOME}/.config/observability/slack-webhook.url
