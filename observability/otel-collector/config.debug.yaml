processors:
  filter/spans:
    error_mode: propagate
    traces:
      span:
        - 'not IsMatch(name, "^claude_code[.](interaction|llm_request|tool|tool[.]blocked_on_user|tool[.]execution|hook)$")'
        - 'Len(span.links) > 0'

  transform/traces:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - 'keep_keys(span.attributes, ["tool_name", "model", "success", "status_code", "duration_ms", "decision", "source", "hook_event"])'
          - 'set(span.attributes["tool_name"], "other") where span.attributes["tool_name"] != nil and (not IsString(span.attributes["tool_name"]) or not IsMatch(span.attributes["tool_name"], "^[A-Za-z0-9_.-]{1,48}$"))'
          - 'set(span.attributes["model"], "other") where span.attributes["model"] != nil and (not IsString(span.attributes["model"]) or not IsMatch(span.attributes["model"], "^claude-(fable|opus|sonnet|haiku)-[0-9]{1,2}(-[0-9]{1,2})?$"))'
          - 'set(span.attributes["success"], "other") where span.attributes["success"] != nil and not IsMatch(String(span.attributes["success"]), "^(true|false)$")'
          - 'set(span.attributes["status_code"], "other") where span.attributes["status_code"] != nil and not IsMatch(String(span.attributes["status_code"]), "^[1-5][0-9]{2}$")'
          - 'set(span.attributes["decision"], "other") where span.attributes["decision"] != nil and not IsMatch(String(span.attributes["decision"]), "^(accept|reject|cancelled)$")'
          - 'set(span.attributes["source"], "other") where span.attributes["source"] != nil and not IsMatch(String(span.attributes["source"]), "^(config|hook|user_permanent|user_temporary|user_abort|user_reject)$")'
          - 'set(span.attributes["hook_event"], "other") where span.attributes["hook_event"] != nil and not IsMatch(String(span.attributes["hook_event"]), "^(SessionStart|Setup|UserPromptSubmit|UserPromptExpansion|PreToolUse|PermissionRequest|PermissionDenied|PostToolUse|PostToolUseFailure|PostToolBatch|Notification|MessageDisplay|SubagentStart|SubagentStop|TaskCreated|TaskCompleted|Stop|StopFailure|TeammateIdle|InstructionsLoaded|ConfigChange|CwdChanged|DirectoryAdded|FileChanged|WorktreeCreate|WorktreeRemove|PreCompact|PostCompact|PreModelSwitch|PostModelSwitch|Elicitation|ElicitationResult|SessionEnd)$")'
          - 'delete_key(span.attributes, "duration_ms") where span.attributes["duration_ms"] != nil and not IsMatch(String(span.attributes["duration_ms"]), "^[0-9]{1,9}([.][0-9]+)?$")'
          - 'delete_key(span.attributes, "tool_name") where span.attributes["tool_name"] == nil'
          - 'delete_key(span.attributes, "model") where span.attributes["model"] == nil'
          - 'delete_key(span.attributes, "success") where span.attributes["success"] == nil'
          - 'delete_key(span.attributes, "status_code") where span.attributes["status_code"] == nil'
          - 'delete_key(span.attributes, "duration_ms") where span.attributes["duration_ms"] == nil'
          - 'delete_key(span.attributes, "decision") where span.attributes["decision"] == nil'
          - 'delete_key(span.attributes, "source") where span.attributes["source"] == nil'
          - 'delete_key(span.attributes, "hook_event") where span.attributes["hook_event"] == nil'
          - 'set(span.status.message, "")'
          - 'set(span.trace_state, "")'
      - context: spanevent
        statements:
          - 'keep_keys(spanevent.attributes, [])'
          - 'set(spanevent.name, "event")'
      - context: scope
        statements:
          - 'keep_keys(scope.attributes, [])'
          - 'set(scope.name, "claude_code")'
          - 'set(scope.version, "")'

  transform/trace_resource:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - 'keep_keys(resource.attributes, ["service.name"])'
          - 'set(resource.attributes["service.name"], "other") where resource.attributes["service.name"] != nil and not IsMatch(String(resource.attributes["service.name"]), "^[A-Za-z0-9._-]{1,48}$")'

exporters:
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    timeout: 5s
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      queue_size: 200
  otlp_http/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true
    timeout: 5s
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      queue_size: 200

service:
  pipelines:
    logs/raw:
      receivers: [otlp]
      processors: [memory_limiter, filter/events, transform/error_class, transform/allowlist, transform/resource, batch/events]
      exporters: [otlp_http/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/spans, transform/traces, transform/trace_resource, batch/events]
      exporters: [otlp_http/tempo]
