apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: ai-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm@sha256:468c25f35f3e5ec4e414974f00deab93337b1b4d9953cabcfd3722e59415f834
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_SALT_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          # Phase 2: on first boot against a fresh Postgres, LiteLLM runs Prisma
          # schema migrations before it binds :4000. The old liveness delay (10s)
          # SIGKILLed it mid-migration (exit 137, "connection refused" on the
          # probe) into a crashloop. startupProbe gives boot+migration up to ~2.5m
          # before liveness/readiness are even evaluated.
          startupProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            # Phase 2 bumped the memory limit 1Gi -> 2Gi: connecting to Postgres
            # makes LiteLLM boot a Prisma migration engine (Rust query-engine +
            # Node migrate) whose spike OOMKilled the pod (exit 137, OOMKilled)
            # at the old 1Gi ceiling ~106s into boot. Phase 1's master-key-only
            # boot fit in 1Gi; the DB path does not.
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: config
          configMap:
            name: litellm-config
