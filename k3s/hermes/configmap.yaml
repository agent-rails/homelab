apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: ai-infra
data:
  config.yaml: |
    model:
      provider: custom
      base_url: http://litellm-proxy.ai-infra.svc.cluster.local:4000/v1
      default: gpt-oss-default
      key_env: LITELLM_MASTER_KEY
    toolsets:
      - hermes-cli
      - terminal
